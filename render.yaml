services:
  - type: web
    name: novarch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: false
    envVars:
      - key: PUBLIC_SITE_URL
        value: https://novarch.eu
      - key: ALLOWED_ORIGINS
        value: https://novarch.eu,https://www.novarch.eu
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: novarch
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_LIST_NAME
        value: Novarch Early Access
